<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">같은 모델의 AMD·Intel·Furiosa 실행 단계 비교</title><desc id="desc">세 스택 모두 모델을 그래프로 변환하고 사용자 공간에서 장치 실행물을 만든 뒤 런타임이 드라이버를 통해 제출한다.</desc><rect width="1000" height="500" fill="#fbfaf7"/><g font-family="sans-serif" text-anchor="middle"><text x="168" y="32" font-size="21" fill="#9d2633">AMD Ryzen AI</text><rect x="12" y="55" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#9d2633"/><text x="168" y="87" font-size="15" fill="#202a30">PyTorch Linear → ReLU</text><path d="M168,110v21m-5,-6l5,6l5,-6" fill="none" stroke="#9d2633" stroke-width="2"/><rect x="12" y="134" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#9d2633"/><text x="168" y="166" font-size="15" fill="#202a30">export → ONNX / Gemm + Relu</text><path d="M168,189v21m-5,-6l5,6l5,-6" fill="none" stroke="#9d2633" stroke-width="2"/><rect x="12" y="213" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#9d2633"/><text x="168" y="245" font-size="15" fill="#202a30">Vitis AI EP → NPU 컴파일</text><path d="M168,268v21m-5,-6l5,6l5,-6" fill="none" stroke="#9d2633" stroke-width="2"/><rect x="12" y="292" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#9d2633"/><text x="168" y="324" font-size="15" fill="#202a30">ORT session.run</text><path d="M168,347v21m-5,-6l5,6l5,-6" fill="none" stroke="#9d2633" stroke-width="2"/><rect x="12" y="371" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#9d2633"/><text x="168" y="403" font-size="15" fill="#202a30">런타임 → XDNA 드라이버 → NPU</text><text x="500" y="32" font-size="21" fill="#164f73">Intel NPU</text><rect x="344" y="55" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#164f73"/><text x="500" y="87" font-size="15" fill="#202a30">PyTorch Linear → ReLU</text><path d="M500,110v21m-5,-6l5,6l5,-6" fill="none" stroke="#164f73" stroke-width="2"/><rect x="344" y="134" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#164f73"/><text x="500" y="166" font-size="15" fill="#202a30">ov.convert_model → OpenVINO IR</text><path d="M500,189v21m-5,-6l5,6l5,-6" fill="none" stroke="#164f73" stroke-width="2"/><rect x="344" y="213" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#164f73"/><text x="500" y="245" font-size="15" fill="#202a30">compile_model → NPU 컴파일</text><path d="M500,268v21m-5,-6l5,6l5,-6" fill="none" stroke="#164f73" stroke-width="2"/><rect x="344" y="292" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#164f73"/><text x="500" y="324" font-size="15" fill="#202a30">OpenVINO 추론 요청</text><path d="M500,347v21m-5,-6l5,6l5,-6" fill="none" stroke="#164f73" stroke-width="2"/><rect x="344" y="371" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#164f73"/><text x="500" y="403" font-size="15" fill="#202a30">런타임 → Intel 드라이버 → NPU</text><text x="832" y="32" font-size="21" fill="#246352">Furiosa RNGD</text><rect x="676" y="55" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#246352"/><text x="832" y="87" font-size="15" fill="#202a30">PyTorch Linear → ReLU</text><path d="M832,110v21m-5,-6l5,6l5,-6" fill="none" stroke="#246352" stroke-width="2"/><rect x="676" y="134" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#246352"/><text x="832" y="166" font-size="15" fill="#202a30">torch.export → ATen 그래프</text><path d="M832,189v21m-5,-6l5,6l5,-6" fill="none" stroke="#246352" stroke-width="2"/><rect x="676" y="213" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#246352"/><text x="832" y="245" font-size="15" fill="#202a30">SDK compile → Runnable</text><path d="M832,268v21m-5,-6l5,6l5,-6" fill="none" stroke="#246352" stroke-width="2"/><rect x="676" y="292" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#246352"/><text x="832" y="324" font-size="15" fill="#202a30">FuryNo5 바인딩 → SDK 호출</text><path d="M832,347v21m-5,-6l5,6l5,-6" fill="none" stroke="#246352" stroke-width="2"/><rect x="676" y="371" width="312" height="55" rx="9" fill="#f0f1ef" stroke="#246352"/><text x="832" y="403" font-size="15" fill="#202a30">런타임 → Furiosa 드라이버 → NPU</text><text x="500" y="480" font-size="16" fill="#303a40">상단 4단계는 사용자 공간의 모델 처리 · 마지막 단계에서 장치 제출</text></g></svg>
