<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
 <title id="title">학습과 추론을 작은 숫자로 구분하기</title>
 <desc id="desc">학습은 입력 1, 2, 3과 정답 3, 5, 7을 보고 곱하는 수 2와 더하는 수 1을 찾는 과정이다. 추론은 찾은 두 수를 사용해 새 입력 4에 2를 곱하고 1을 더하여 9를 구한다. 곱하는 수는 가중치, 더하는 수는 바이어스다. 두 계산을 한 커널로 실행할지 나눌지는 실행 방법의 선택이다.</desc>
 <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#51677b" stroke-width="1.6"/></marker></defs>
 <rect width="980" height="440" rx="14" fill="#f7f8fa"/>
 <g font-family="system-ui,sans-serif" fill="#193147">
  <text x="30" y="37" font-size="22" font-weight="700">같은 계산 규칙을 ‘찾을 때’와 ‘사용할 때’</text>
  <rect x="24" y="57" width="932" height="140" rx="12" fill="#e8f0fb"/>
  <text x="42" y="85" font-size="18" font-weight="700">학습: 예제의 정답에 맞도록 계산에 쓸 수를 찾는다</text>
  <g fill="white" stroke="#6f8fb2" stroke-width="1.5"><rect x="44" y="105" width="274" height="66" rx="8"/><rect x="389" y="105" width="220" height="66" rx="8"/><rect x="680" y="105" width="252" height="66" rx="8"/></g>
  <g text-anchor="middle" font-size="18"><text x="181" y="131">입력 1, 2, 3</text><text x="181" y="156">정답 3, 5, 7</text><text x="499" y="143">맞는 수를 찾아 조정</text><text x="806" y="131">곱하는 수 2 · 더하는 수 1</text><text x="806" y="156" font-size="14">이 예에 맞는 규칙</text></g>
  <rect x="24" y="215" width="932" height="190" rx="12" fill="#e7f3ed"/>
  <text x="42" y="245" font-size="18" font-weight="700">추론: 찾은 규칙에 새 입력을 넣어 답을 구한다</text>
  <g fill="white" stroke="#5d9178" stroke-width="1.5"><rect x="44" y="267" width="150" height="68" rx="8"/><rect x="265" y="267" width="190" height="68" rx="8"/><rect x="526" y="267" width="190" height="68" rx="8"/><rect x="787" y="267" width="145" height="68" rx="8"/></g>
  <g text-anchor="middle" font-size="18"><text x="119" y="307">새 입력 4</text><text x="360" y="294">2를 곱함 → 8</text><text x="360" y="320" font-size="14">2: 가중치(weight)</text><text x="621" y="294">1을 더함 → 9</text><text x="621" y="320" font-size="14">1: 바이어스(bias)</text><text x="859" y="307">답 9</text></g>
  <path d="M265 350V363H716V350" stroke="#5d9178" fill="none" stroke-width="1.5"/>
  <text x="490" y="387" text-anchor="middle" font-size="15">장치에서는 두 계산을 한 커널로 묶거나 나눌 수 있다</text>
  <g fill="none" stroke="#51677b" stroke-width="2" marker-end="url(#a)"><path d="M318 138H379"/><path d="M609 138H670"/><path d="M194 301H255"/><path d="M455 301H516"/><path d="M716 301H777"/></g>
  <text x="30" y="428" font-size="13" fill="#576c7c">개념 설명용 숫자 · 실제 학습 절차나 NPU 실행 성능을 재현하는 그림은 아님</text>
 </g>
</svg>
