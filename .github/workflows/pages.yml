name: Validate and deploy handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static documentation
        run: |
          python3 tools/check_site.py
          node --check assets/site.js
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir dist
          cp *.html search-index.json .nojekyll dist/
          cp -r chapter assets examples data dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
