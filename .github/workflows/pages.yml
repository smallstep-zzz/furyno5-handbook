name: Validate and deploy handbook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-noto-cjk
          npm install --ignore-scripts --no-audit --no-fund
      - name: Generate public HTML from Markdown
        run: npm run build
      - name: Validate generated documentation
        run: |
          npm run check
          node --check assets/site.js
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir dist
          cp *.html search-index.json .nojekyll dist/
          cp -r chapter assets examples data dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
